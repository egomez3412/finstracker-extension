<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="finstracker-extension: one-click sync your credit card points from any issuer portal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#161a1f"/>
      <stop offset="100%" stop-color="#0f1216"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#d4a64a"/>
      <stop offset="100%" stop-color="#f0c66d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#2a2f37"/>
      <stop offset="100%" stop-color="#1a1d22"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D6B4A"/>
      <stop offset="100%" stop-color="#155138"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- ambient gold glow -->
  <circle cx="1080" cy="160" r="200" fill="#d4a64a" opacity="0.10" filter="url(#soft)"/>
  <circle cx="980"  cy="80"  r="80"  fill="#d4a64a" opacity="0.18" filter="url(#soft)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280"/>
    <path d="M320 0 V320 M640 0 V320 M960 0 V320"/>
  </g>

  <!-- stacked credit cards on the right -->
  <g transform="translate(820,70) rotate(-8)">
    <rect width="320" height="190" rx="18" fill="url(#card)" stroke="#d4a64a" stroke-opacity="0.35"/>
    <rect x="24" y="24" width="44" height="32" rx="5" fill="#d4a64a" opacity="0.85"/>
    <rect x="24" y="130" width="180" height="10" rx="2" fill="#ffffff" opacity="0.55"/>
    <rect x="24" y="150" width="120" height="8"  rx="2" fill="#ffffff" opacity="0.30"/>
    <text x="296" y="40" text-anchor="end" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto" font-size="13" fill="#d4a64a" letter-spacing="2">FINS</text>
  </g>
  <g transform="translate(870,110) rotate(4)">
    <rect width="320" height="190" rx="18" fill="url(#card)" stroke="#d4a64a" stroke-opacity="0.55"/>
    <rect x="24" y="24" width="44" height="32" rx="5" fill="#d4a64a"/>
    <rect x="24" y="130" width="220" height="10" rx="2" fill="#ffffff" opacity="0.7"/>
    <rect x="24" y="150" width="140" height="8"  rx="2" fill="#ffffff" opacity="0.4"/>
    <text x="296" y="40" text-anchor="end" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto" font-size="13" fill="#f0c66d" letter-spacing="2">SYNC</text>
  </g>

  <!-- browser window mock on the left -->
  <g transform="translate(72,72)">
    <!-- window chrome -->
    <rect width="540" height="176" rx="14" fill="#0b0d10" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="22" cy="22" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="22" r="6" fill="#27c93f"/>
    <!-- address bar -->
    <rect x="86" y="12" width="360" height="22" rx="11" fill="#1a1d22" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="98" y="27" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#9aa3ad">ultimaterewards.chase.com</text>
    <!-- pinned Fins icon -->
    <g transform="translate(458,12)">
      <rect width="22" height="22" rx="5" fill="url(#emerald)"/>
      <text x="11" y="16" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto" font-weight="700" font-size="13" fill="#f6f1e6">F</text>
    </g>
    <!-- portal body: balance scrape -->
    <text x="24" y="74" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto" font-size="12" fill="#9aa3ad" letter-spacing="1">ULTIMATE REWARDS BALANCE</text>
    <text x="24" y="116" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto" font-weight="700" font-size="40" fill="#f6f1e6">94,308 <tspan font-size="18" fill="#9aa3ad">pts</tspan></text>
    <!-- highlight box around the number -->
    <rect x="20" y="86" width="220" height="44" rx="6" fill="none" stroke="#d4a64a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- sync status line -->
    <g transform="translate(24,148)">
      <circle cx="6" cy="0" r="5" fill="#27c93f"/>
      <text x="20" y="4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#27c93f">Synced to Fins · +1,842 pts</text>
    </g>
  </g>

  <!-- title block -->
  <g transform="translate(72,260)">
    <text font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto" font-weight="700" font-size="34" fill="#f6f1e6">finstracker-extension</text>
    <text y="32" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto" font-size="16" fill="#9aa3ad">One click and your credit card points balance is current.</text>
  </g>

  <!-- gold accent bar -->
  <rect x="0" y="316" width="1280" height="4" fill="url(#gold)"/>
</svg>
